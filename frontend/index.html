<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Gestão</title>
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    .login-card h1 {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    /* Mensagem totalmente oculta quando vazia */
    #mensagemErro {
      display: none;
      margin: 0.75rem 0;
    }
    #mensagemErro:not(:empty) {
      display: block;
    }
    .btn-login {
      margin-top: 0.5rem;
    }
    .form-grupo {
      margin-bottom: 1rem;
    }
  </style>
</head>

<body class="pagina-login">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-icon">🔐</div>

      <h1>Acesso ao Sistema</h1>

      <p class="login-subtitulo">
        Entre com suas credenciais para continuar
      </p>

      <form id="formLogin">

        <div class="grupo form-grupo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            required
            placeholder="seu@email.com">
        </div>

        <div class="grupo form-grupo">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            required
            placeholder="Digite sua senha">
        </div>

        <div id="mensagemErro" class="mensagem erro"></div>

        <button
          type="submit"
          class="btn btn-principal btn-login">
          Entrar no Sistema
        </button>

      </form>

      <div class="login-rodape">
        <p>Sistema de Gestão — Clientes & Fornecedores</p>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
