<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiais — Sistema de Gestão</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Cabeçalho IGUAL ao clientes.html -->
  <header class="cabecalho">
    <div class="logo">
      <span class="logo__icone">⚙️</span>
      <span>Sistema de Gestão</span>
    </div>
    
    <nav class="navegacao">
      <a href="dashboard.html" class="nav-link">Início</a>
      <a href="clientes.html" class="nav-link">Clientes</a>
      <a href="fornecedores.html" class="nav-link">Fornecedores</a>
      <a href="materiais.html" class="nav-link ativo">Materiais</a>
      <a href="orcamentos.html" class="nav-link">Orçamentos</a>
      <a href="projetos.html" class="nav-link">Projetos</a>
      <a href="usuarios.html" class="nav-link">Usuários</a>
    </nav>
    
    <div class="usuario-area">
      <span class="usuario-nome" id="nomeUsuario">Usuário</span>
      <span class="tag-nivel" id="nivelUsuario">consulta</span>
      <a href="dashboard.html" class="btn btn-secundario" style="margin-left: 0.5rem;">Voltar</a>
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <h1 class="titulo-pagina">📦 Gestão de Materiais</h1>

    <div class="painel-cartoes">
      
      <!-- Card Cadastro -->
      <div class="cartao">
        <h2 id="tituloForm" style="margin-top: 0; margin-bottom: 1.5rem;">➕ Novo Material</h2>
        <form id="formMaterial">
          <input type="hidden" id="materialId">
          
          <div class="linha-form">
            <div class="grupo">
              <label>Nome *</label>
              <input type="text" id="mat_nome" required>
            </div>
            <div class="grupo">
              <label>Unidade *</label>
              <input type="text" id="mat_unidade" required placeholder="ex: m, kg, un">
            </div>
            <div class="grupo">
              <label>Preço Unitário (R$) *</label>
              <input type="text" id="mat_preco_unitario" required>
            </div>
          </div>

          <div id="mensagem" class="mensagem"></div>
          
          <div class="botoes-form">
            <button type="submit" class="btn">💾 Salvar</button>
            <button type="button" id="btnCancelar" class="btn secundario limpar">Cancelar</button>
          </div>
        </form>
      </div>

      <!-- Card Lista -->
      <div class="cartao">
        <h2 style="margin-top: 0; margin-bottom: 1.5rem;">📋 Lista de Materiais <span id="contagem"></span></h2>
        <div class="tabela-container">
          <table id="tabelaMateriais">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Unidade</th>
                <th>Preço Unitário</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaMateriais"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/materiais.js"></script>
</body>
</html>
